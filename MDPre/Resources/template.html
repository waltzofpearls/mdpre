<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="github-markdown.css">
<link rel="stylesheet" href="highlight-github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="highlight-github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
    }
    @media (prefers-color-scheme: light) {
        body { background-color: #cecece; }
    }
    @media (prefers-color-scheme: dark) {
        body { background-color: #3b3b3b; }
    }
    .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        /* Fill the window for short documents. Without this the article stops at the
           last line and the body background shows as a band underneath. 100vh because
           body and html have auto height, so a percentage would compute to auto. */
        min-height: 100vh;
        padding: 45px;
        background-color: var(--bgColor-default);
    }
    @media (max-width: 767px) {
        .markdown-body {
            padding: 15px;
        }
    }
    mark.find-highlight {
        background: #ffeb3b;
        color: inherit;
    }
    mark.find-current {
        background: #f9a825;
        border-radius: 2px;
    }
    /* Speech highlighting uses the CSS Custom Highlight API rather than wrapping
       elements, so the DOM is never mutated, stored node references stay valid
       while speaking, and find in page cannot collide with it. */
    ::highlight(speech-block) {
        background-color: rgba(140, 50, 190, 0.14);
    }
    ::highlight(speech-word) {
        background-color: rgba(140, 50, 190, 0.36);
    }
    .markdown-body input[type=checkbox].speech-active {
        outline: 2px solid rgba(140, 50, 190, 0.70);
        outline-offset: 2px;
        border-radius: 3px;
    }
    @media (prefers-color-scheme: dark) {
        mark.find-highlight {
            background: #7b6a1e;
        }
        mark.find-current {
            background: #b8941e;
        }
        ::highlight(speech-block) {
            background-color: rgba(202, 140, 255, 0.20);
        }
        ::highlight(speech-word) {
            background-color: rgba(202, 140, 255, 0.45);
        }
        .markdown-body input[type=checkbox].speech-active {
            outline-color: rgba(202, 140, 255, 0.75);
        }
    }
    @media print {
        @page {
            size: A4;
            margin: 20mm;
        }
        body {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .markdown-body {
            max-width: none;
            padding: 0;
            /* Undo the viewport fill so printing does not emit a blank block. */
            min-height: 0;
        }
        pre, code, table, figure, blockquote {
            page-break-inside: avoid;
            break-inside: avoid;
        }
        h1, h2, h3, h4, h5, h6 {
            page-break-after: avoid;
            break-after: avoid;
        }
        mark.find-highlight, mark.find-current {
            background: none;
        }
        ::highlight(speech-block), ::highlight(speech-word) {
            background-color: transparent;
        }
        .markdown-body input[type=checkbox].speech-active {
            outline: none;
        }
    }
</style>
</head>
<body>
<article class="markdown-body" id="content"></article>
<script>
    marked.setOptions({
        gfm: true,
        breaks: false,
        highlight: (code, lang) => {
            if (lang && hljs.getLanguage(lang)) {
                return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
        }
    });

    function resolveLocalURL(relative, baseURL, scheme) {
        if (!relative || relative.startsWith('http://') || relative.startsWith('https://') ||
            relative.startsWith('data:') || relative.startsWith('mailto:') || relative.startsWith('#')) {
            return relative;
        }
        try {
            return new URL(relative, baseURL).href.replace(/^file:\/\//, `${scheme}://`);
        } catch { return relative; }
    }

    function renderMarkdown(text, baseURL) {
        clearFind();
        clearSpeechHighlight();
        document.documentElement.scrollTop = 0;
        if (baseURL) {
            text = text.replace(/(!\[[^\]]*\]\()([^)]+)(\))/g, (_, pre, src, post) =>
                pre + resolveLocalURL(src, baseURL, 'mdpre-res') + post
            );
            text = text.replace(/(<img\b[^>]*\bsrc\s*=\s*["'])([^"']+)(["'])/gi, (_, pre, src, post) =>
                pre + resolveLocalURL(src, baseURL, 'mdpre-res') + post
            );
        }
        document.getElementById('content').innerHTML = marked.parse(text);
        if (baseURL) {
            document.querySelectorAll('#content a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('http://') ||
                    href.startsWith('https://') || href.startsWith('mailto:')) {
                    return;
                }
                try {
                    const resolved = new URL(href, baseURL).href;
                    a.href = resolved.replace(/^file:\/\//, 'mdpre-file://');
                } catch {}
            });
        }
    }

    function getTableOfContents() {
        const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
        const toc = [];
        const idCounts = {};
        for (const h of headings) {
            if (!h.id) {
                let slug = h.textContent.trim().toLowerCase()
                    .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
                if (idCounts[slug] !== undefined) {
                    idCounts[slug]++;
                    slug += `-${idCounts[slug]}`;
                } else {
                    idCounts[slug] = 0;
                }
                h.id = slug;
            }
            toc.push({
                level: parseInt(h.tagName.charAt(1)),
                text: h.textContent.trim(),
                id: h.id
            });
        }
        return JSON.stringify(toc);
    }

    function scrollToHeading(id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // --- Scroll sync (percentage-based) ---

    let ignoreNextScroll = false;

    function getScrollPercent() {
        const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        if (scrollHeight <= 0) return 0;
        return scrollTop / scrollHeight;
    }

    function scrollToPercent(percent) {
        ignoreNextScroll = true;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        window.scrollTo({ top: percent * scrollHeight });
    }

    window.addEventListener('scroll', () => {
        if (ignoreNextScroll) {
            ignoreNextScroll = false;
            return;
        }
        const percent = getScrollPercent();
        if (window.webkit?.messageHandlers?.scrollSync) {
            window.webkit.messageHandlers.scrollSync.postMessage(percent);
        }
    }, { passive: true });

    function setFullWidth(enabled) {
        const content = document.getElementById('content');
        if (enabled) {
            content.style.maxWidth = 'none';
            content.style.margin = '0';
        }
    }

    // --- Speech ---

    // Highlighting maps a spoken offset back to a text node. Whitespace is collapsed
    // and a few words are invented, so each stretch copied verbatim from one text
    // node is recorded as a segment. Offsets no segment covers are the invented ones.

    let speechBlocks = [];
    let speechIndex = -1;
    let speechCheckbox = null;

    // Registered once, then mutated. Swapping the registry entry on every word
    // leaves the old registration to be torn down roughly two hundred times per
    // document, and stale paint has been observed in the app that way.
    const speechBlockHighlight = new Highlight();
    const speechWordHighlight = new Highlight();
    CSS.highlights.set('speech-block', speechBlockHighlight);
    CSS.highlights.set('speech-word', speechWordHighlight);

    function newSpokenText() {
        return { text: '', segments: [] };
    }

    // Words with no source in the document, a checkbox state or a cell separator.
    function appendSynthesized(spoken, words) {
        spoken.text += words;
    }

    function appendElement(spoken, el) {
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
            const source = node.textContent;
            let segment = null;
            for (let i = 0; i < source.length; i++) {
                if (/\s/.test(source[i])) {
                    if (spoken.text.length && !spoken.text.endsWith(' ')) spoken.text += ' ';
                    segment = null;   // whitespace collapsed, so the copied stretch ends
                    continue;
                }
                if (!segment) {
                    segment = { start: spoken.text.length, node, nodeOffset: i, length: 0 };
                    spoken.segments.push(segment);
                }
                spoken.text += source[i];
                segment.length++;
            }
        }
    }

    function extractSpeechChunks() {
        const content = document.getElementById('content');
        speechBlocks = [];
        clearSpeechHighlight();
        const chunks = [];
        const selector = 'h1, h2, h3, h4, h5, h6, p, li, tr';
        for (const el of content.querySelectorAll(selector)) {
            if (el.closest('pre')) continue;   // never read code aloud
            // Only the innermost block speaks, or a loose list item would be read
            // twice, once as the li and again as the p inside it.
            if (el.querySelector(selector)) continue;

            const spoken = newSpokenText();
            let checkbox = null;
            if (el.tagName === 'TR') {
                // A whole row as one phrase. Per cell, every number is its own utterance.
                for (const cell of el.children) {
                    if (!cell.textContent.trim()) continue;
                    if (spoken.text) appendSynthesized(spoken, ', ');
                    appendElement(spoken, cell);
                }
            } else {
                checkbox = el.querySelector('input[type=checkbox]');
                if (checkbox) {
                    appendSynthesized(spoken, checkbox.checked ? 'Done. ' : 'Not done. ');
                }
                appendElement(spoken, el);
            }

            const text = spoken.text.trim();
            if (!text) continue;
            speechBlocks.push({ el, checkbox, segments: spoken.segments });
            chunks.push(text);
        }
        return JSON.stringify(chunks);
    }

    function rangeForSpokenOffsets(segments, start, length) {
        const end = start + length;
        let range = null;
        for (const segment of segments) {
            if (segment.start + segment.length <= start || segment.start >= end) continue;
            const from = segment.nodeOffset + Math.max(0, start - segment.start);
            const to = segment.nodeOffset + Math.min(segment.length, end - segment.start);
            if (!range) {
                range = document.createRange();
                range.setStart(segment.node, from);
            }
            range.setEnd(segment.node, to);
        }
        return range;
    }

    function markSpeechCheckbox(checkbox) {
        if (speechCheckbox === checkbox) return;
        if (speechCheckbox) speechCheckbox.classList.remove('speech-active');
        speechCheckbox = checkbox;
        if (checkbox) checkbox.classList.add('speech-active');
    }

    // WebKit can leave a sliver of the old highlight along the bottom of a block
    // once the highlight moves away. Briefly giving the element its own stacking
    // context forces that area to repaint. Once per block, never per word.
    function repaintBlock(el) {
        if (!el) return;
        el.style.opacity = '0.999';
        void el.offsetHeight;
        el.style.opacity = '';
    }

    function highlightSpeech(index, start, length) {
        const block = speechBlocks[index];
        if (!block) return;

        const blockRange = document.createRange();
        blockRange.selectNodeContents(block.el);
        speechBlockHighlight.clear();
        speechBlockHighlight.add(blockRange);

        const wordRange = rangeForSpokenOffsets(block.segments, start, length);
        speechWordHighlight.clear();
        if (wordRange) speechWordHighlight.add(wordRange);

        // A checkbox holds no text, so a range over it is empty and the highlight
        // API cannot reach it. No range means an invented word is being spoken,
        // which on a task item is its state, so mark the box itself instead.
        markSpeechCheckbox(wordRange ? null : block.checkbox);

        // Only scroll when the block changes. Following every word jitters the
        // page, and scrollIntoViewIfNeeded leaves it alone while it is visible.
        if (index !== speechIndex) {
            const previous = speechBlocks[speechIndex];
            speechIndex = index;
            repaintBlock(previous && previous.el);
            block.el.scrollIntoViewIfNeeded();
        }
    }

    function clearSpeechHighlight() {
        const previous = speechBlocks[speechIndex];
        speechBlockHighlight.clear();
        speechWordHighlight.clear();
        markSpeechCheckbox(null);
        speechIndex = -1;
        repaintBlock(previous && previous.el);
    }

    // --- Find in page ---

    let findMatches = [];
    let findIndex = -1;

    function findInPage(query) {
        clearFind();
        if (!query) return JSON.stringify({ total: 0, current: 0 });

        const content = document.getElementById('content');
        const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);

        const lowerQuery = query.toLowerCase();

        for (const node of textNodes) {
            const parent = node.parentNode;
            if (parent.closest('mark.find-highlight')) continue;

            const text = node.textContent;
            const lower = text.toLowerCase();
            const parts = [];
            let lastIdx = 0;
            let idx;

            while ((idx = lower.indexOf(lowerQuery, lastIdx)) !== -1) {
                if (idx > lastIdx) parts.push(document.createTextNode(text.slice(lastIdx, idx)));
                const mark = document.createElement('mark');
                mark.className = 'find-highlight';
                mark.textContent = text.slice(idx, idx + query.length);
                parts.push(mark);
                findMatches.push(mark);
                lastIdx = idx + query.length;
            }

            if (parts.length > 0) {
                if (lastIdx < text.length) parts.push(document.createTextNode(text.slice(lastIdx)));
                const fragment = document.createDocumentFragment();
                for (const p of parts) fragment.appendChild(p);
                parent.replaceChild(fragment, node);
            }
        }

        if (findMatches.length > 0) {
            findIndex = 0;
            findMatches[0].classList.add('find-current');
            findMatches[0].scrollIntoView({ block: 'center' });
        }
        return JSON.stringify({ total: findMatches.length, current: findMatches.length > 0 ? 1 : 0 });
    }

    function findNext() {
        if (!findMatches.length) return JSON.stringify({ total: 0, current: 0 });
        findMatches[findIndex].classList.remove('find-current');
        findIndex = (findIndex + 1) % findMatches.length;
        findMatches[findIndex].classList.add('find-current');
        findMatches[findIndex].scrollIntoView({ block: 'center' });
        return JSON.stringify({ total: findMatches.length, current: findIndex + 1 });
    }

    function findPrevious() {
        if (!findMatches.length) return JSON.stringify({ total: 0, current: 0 });
        findMatches[findIndex].classList.remove('find-current');
        findIndex = (findIndex - 1 + findMatches.length) % findMatches.length;
        findMatches[findIndex].classList.add('find-current');
        findMatches[findIndex].scrollIntoView({ block: 'center' });
        return JSON.stringify({ total: findMatches.length, current: findIndex + 1 });
    }

    function clearFind() {
        for (const mark of findMatches) {
            const parent = mark.parentNode;
            if (parent) {
                parent.replaceChild(document.createTextNode(mark.textContent), mark);
                parent.normalize();
            }
        }
        findMatches = [];
        findIndex = -1;
    }
</script>
</body>
</html>
