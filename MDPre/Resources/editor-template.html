<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="codemirror-editor.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    #editor { height: 100%; }
    .cm-editor { height: 100%; }
    .cm-editor.cm-focused { outline: none; }
</style>
</head>
<body>
<div id="editor"></div>
<script>
    MDPreEditor.initEditor(document.getElementById("editor"));

    function setContent(text) { MDPreEditor.setContent(text); }
    function getContent() { return MDPreEditor.getContent(); }
    function scrollToPercent(p) { MDPreEditor.scrollToPercent(p); }

    function formatBold() { MDPreEditor.formatBold(); }
    function formatItalic() { MDPreEditor.formatItalic(); }
    function formatStrikethrough() { MDPreEditor.formatStrikethrough(); }
    function formatCode() { MDPreEditor.formatCode(); }
    function formatCodeBlock() { MDPreEditor.formatCodeBlock(); }
    function formatHeading(level) { MDPreEditor.formatHeading(level); }
    function formatUnorderedList() { MDPreEditor.formatUnorderedList(); }
    function formatOrderedList() { MDPreEditor.formatOrderedList(); }
    function formatBlockquote() { MDPreEditor.formatBlockquote(); }
    function formatHorizontalRule() { MDPreEditor.formatHorizontalRule(); }
    function formatLink() { MDPreEditor.formatLink(); }
    function formatImage() { MDPreEditor.formatImage(); }
    function formatTable() { MDPreEditor.formatTable(); }

    function findInPage(q) { return MDPreEditor.findInPage(q); }
    function findNext() { return MDPreEditor.findNext(); }
    function findPrevious() { return MDPreEditor.findPrevious(); }
    function clearFind() { MDPreEditor.clearFind(); }
</script>
</body>
</html>
